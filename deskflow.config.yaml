# Non-secret, user-editable settings. Secrets live in .env / GitHub Actions secrets, never here.

topics:
  - "tabular deep learning"
  - "tabular representation learning"
  - "tabular foundation models"
  - "differentiable trees"
  - "tabular transformers"
  - "Numerical Embeddings"

research_interests: >
  M.Sc. Data Analytics student working on tabular deep learning: MLP and
  attention-based architectures, tabular representation learning, tabular
  foundation models, differentiable trees, tabular transformers, and
  numerical embeddings for tabular features. Most interested in papers that
  propose a new tabular-specific architecture or technique with concrete
  benchmark results on tabular classification/regression — not papers that
  merely apply tabular data to an unrelated problem, or use generic
  (non-tabular-specific) deep learning methods on tabular data without
  contributing something tabular-specific.

relevance_rubric:
  High: >
    Proposes a new tabular-specific architecture, representation, embedding
    scheme, or training method (e.g. a new tabular transformer, foundation
    model, differentiable tree method, or numerical embedding technique),
    with concrete benchmark results on tabular classification/regression. A
    paper that merely evaluates an existing generic method ON tabular data,
    or uses tabular data inside an unrelated application domain (e.g.
    healthcare, finance, retail) without proposing a new tabular-specific
    technique, is NOT High just because tabular data appears in it — score
    those Medium or Low instead, based on whether the technique itself is
    tabular-specific and novel.
  Medium: "Adjacent subfield or a useful generic technique applied to tabular data, not a direct tabular-specific architectural contribution."
  Low: "Tangential; only loosely related to the research interests above, or a domain-specific application that happens to use tabular data with no transferable tabular-modeling technique."

# Lookback window for each run, in days. A run only considers papers published
# in [now - lookback_days, now); already-processed arXiv IDs are filtered
# separately via Notion.
lookback_days: 8

# GitHub Actions cron schedule (UTC, best-effort) — keep this comment in sync
# with .github/workflows/digest.yml's `schedule:` entry if you change it.
schedule_cron: "0 8 * * 1" # Monday 08:00 UTC
