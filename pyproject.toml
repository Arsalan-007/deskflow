[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskflow"
version = "0.1.0"
description = "Agentic arXiv research tracker: fetches new papers, extracts grounded fields, scores relevance, logs to Notion, digests to Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arsalan" }]
keywords = ["mcp", "agent", "arxiv", "rag", "evaluation"]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "notion-client>=2.2.1",
    "ollama>=0.3.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
